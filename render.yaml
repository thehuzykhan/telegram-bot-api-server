services:
  - type: web
    name: telegram-bot-api
    env: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    # Lenient health check to prevent restarts during large uploads
    healthCheck:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 60
      timeoutSeconds: 10
      successThreshold: 1
      failureThreshold: 5
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false

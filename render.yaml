services:
  - type: web
    name: telegram-bot-api
    env: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    # Lenient health check to prevent restarts during large uploads (up to 2GB)
    healthCheck:
      path: /health
      initialDelaySeconds: 60
      periodSeconds: 300        # Check every 5 minutes
      timeoutSeconds: 30
      successThreshold: 1
      failureThreshold: 2       # 2 failures × 5 min = 10 min grace period
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
